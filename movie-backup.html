<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Watch Movie - NAMO</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #111;
    }

    header {
      background: #0757b8;
      color: white;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
      color: #ff9800;
    }

    .home-btn {
      background: white;
      color: #0757b8;
      border: none;
      padding: 9px 15px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .container {
      max-width: 1100px;
      margin: 20px auto;
      padding: 0 15px;
    }

    #loading {
      text-align: center;
      padding: 60px 10px;
      font-size: 20px;
    }

    #errorBox {
      display: none;
      text-align: center;
      padding: 60px 10px;
      font-size: 20px;
    }

    .movie-player {
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }

    .namo-player {
      position: relative;
      width: 100%;
      background: #000;
    }

    .namo-player video {
      width: 100%;
      height: auto;
      max-height: 650px;
      display: block;
      background: #000;
    }

    .center-play {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      cursor: pointer;
    }

    .player-controls {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 10px;
      background: linear-gradient(transparent, rgba(0,0,0,.9));
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .player-controls button {
      background: transparent;
      border: none;
      color: white;
      cursor: pointer;
      font-size: 16px;
      padding: 6px;
    }

    #timeText {
      color: white;
      font-size: 13px;
      white-space: nowrap;
    }

    #seekBar {
      flex: 1;
      cursor: pointer;
    }

    .details {
      background: white;
      margin-top: 15px;
      padding: 20px;
      border-radius: 10px;
    }

    .details h1 {
      margin-bottom: 8px;
      font-size: 25px;
    }

    .meta {
      color: #666;
      margin-bottom: 15px;
    }

    .description {
      line-height: 1.6;
      color: #333;
    }

    .action-bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .action-btn {
      border: none;
      padding: 10px 16px;
      border-radius: 7px;
      cursor: pointer;
      background: #0757b8;
      color: white;
      font-weight: bold;
    }

    .action-btn.liked {
      background: #168f45;
    }

    .download-area {
      position: relative;
    }

    .download-menu {
      display: none;
      position: absolute;
      left: 0;
      top: 45px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 7px;
      min-width: 150px;
      z-index: 20;
      box-shadow: 0 5px 15px rgba(0,0,0,.15);
    }

    .download-menu button {
      width: 100%;
      border: none;
      background: white;
      padding: 11px;
      text-align: left;
      cursor: pointer;
    }

    .download-menu button:hover {
      background: #f1f1f1;
    }

    .quality-select {
      padding: 9px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    @media (max-width: 600px) {
      header {
        padding: 12px 15px;
      }

      .logo {
        font-size: 24px;
      }

  </style>
</head>

<body>

  <header>
    <div class="logo">NAMO</div>
    <button class="home-btn" onclick="location.href='index.html'">
      🏠 Home
    </button>
  </header>

  <main class="container">

    <div id="loading">
      🎬 Loading movie...
    </div>

    <div id="errorBox">
      ❌ Movie not found.
      <br><br>
      <button class="action-btn" onclick="location.href='index.html'">
        Back to Home
      </button>
    </div>

    <div id="moviePage" style="display:none;">

      <div class="movie-player">
        <div class="namo-player" id="namoPlayer">

          <video id="videoPlayer" playsinline></video>

          <div class="center-play" id="centerPlay">▶</div>

          <div class="player-controls">
            <button id="playBtn">▶</button>
            <button id="backBtn">↶ 10</button>
            <button id="forwardBtn">10 ↷</button>

            <span id="timeText">0:00 / 0:00</span>

            <input
              type="range"
              id="seekBar"
              min="0"
              max="100"
              value="0"
            >

            <button id="muteBtn">🔊</button>
            <button id="fullscreenBtn">⛶</button>
          </div>

        </div>
      </div>

      <section class="details">

        <h1 id="movieTitle">Movie</h1>

        <div class="meta" id="movieMeta">
          Movie
        </div>

        <p class="description" id="movieDescription">
          Description
        </p>

        <div class="action-bar">

          <button class="action-btn" id="likeBtn">
            👍 <span id="likeCount">0</span>
          </button>

          <button class="action-btn" id="dislikeBtn">
            👎 <span id="dislikeCount">0</span>
          </button>

          <div class="download-area">

            <button class="action-btn" id="downloadBtn">
              ⬇️ Download ▾
            </button>

            <div class="download-menu" id="downloadMenu">

              <button onclick="downloadMovie('Auto')">
                Download Auto
              </button>

              <button onclick="downloadMovie('720p')">
                Download 720p
              </button>

              <button onclick="downloadMovie('480p')">
                Download 480p
              </button>

            </div>

          </div>

          <select class="quality-select" id="qualitySelect">
            <option value="auto">Auto</option>
            <option value="1080p">1080p</option>
            <option value="720p">720p</option>
            <option value="480p">480p</option>
          </select>

        </div>

      </section>

    </div>

  </main>


  <script>
    const params = new URLSearchParams(location.search);
    const movieId = params.get("id");

    const loading = document.getElementById("loading");
    const moviePage = document.getElementById("moviePage");
    const errorBox = document.getElementById("errorBox");

    const video = document.getElementById("videoPlayer");

    const playBtn = document.getElementById("playBtn");
    const backBtn = document.getElementById("backBtn");
    const forwardBtn = document.getElementById("forwardBtn");
    const seekBar = document.getElementById("seekBar");
    const timeText = document.getElementById("timeText");
    const muteBtn = document.getElementById("muteBtn");
    const fullscreenBtn = document.getElementById("fullscreenBtn");
    const centerPlay = document.getElementById("centerPlay");

    let movieData = null;

    function formatTime(seconds) {
      if (!Number.isFinite(seconds)) return "0:00";

      const minutes = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);

      return `${minutes}:${secs.toString().padStart(2, "0")}`;
    }

    function togglePlay() {
      if (video.paused) {
        video.play().catch(error => {
          console.error("Play error:", error);
        });
      } else {
        video.pause();
      }
    }

    playBtn.addEventListener("click", togglePlay);
    centerPlay.addEventListener("click", togglePlay);

    video.addEventListener("play", () => {
      playBtn.textContent = "⏸";
      centerPlay.style.display = "none";
    });

    video.addEventListener("pause", () => {
      playBtn.textContent = "▶";
      centerPlay.style.display = "flex";
    });

    backBtn.addEventListener("click", () => {
      video.currentTime = Math.max(
        0,
        video.currentTime - 10
      );
    });

    forwardBtn.addEventListener("click", () => {
      if (Number.isFinite(video.duration)) {
        video.currentTime = Math.min(
          video.duration,
          video.currentTime + 10
        );
      }
    });

    video.addEventListener("timeupdate", () => {
      if (video.duration) {
        seekBar.value =
          (video.currentTime / video.duration) * 100;
      }

      timeText.textContent =
        `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
    });

    seekBar.addEventListener("input", () => {
      if (video.duration) {
        video.currentTime =
          (seekBar.value / 100) * video.duration;
      }
    });

    video.addEventListener("loadedmetadata", () => {
      timeText.textContent =
        `0:00 / ${formatTime(video.duration)}`;
    });

    muteBtn.addEventListener("click", () => {
      video.muted = !video.muted;

      muteBtn.textContent =
        video.muted ? "🔇" : "🔊";
    });

    fullscreenBtn.addEventListener("click", () => {
      const player =
        document.getElementById("namoPlayer");

      if (document.fullscreenElement) {
        document.exitFullscreen();
      } else if (player.requestFullscreen) {
        player.requestFullscreen();
      }
    });


    async function loadMovie() {
      if (!movieId) {
        showError();
        return;
      }

      try {
        const response = await fetch(
          `/api/movies/${encodeURIComponent(movieId)}`
        );

        if (!response.ok) {
          throw new Error("Movie not found");
        }

        movieData = await response.json();

        document.getElementById("movieTitle").textContent =
          movieData.title || "Untitled Movie";

        document.getElementById("movieMeta").textContent =
          `${movieData.category || "Movie"} • ${movieData.year || ""}`;

        document.getElementById("movieDescription").textContent =
          movieData.description || "No description available.";

        video.src = movieData.videoUrl;

        document.getElementById("likeCount").textContent =
          movieData.likes || 0;

        document.getElementById("dislikeCount").textContent =
          movieData.dislikes || 0;

        loading.style.display = "none";
        moviePage.style.display = "block";

      } catch (error) {
        console.error(error);
        showError();
      }
    }

    function showError() {
      loading.style.display = "none";
      moviePage.style.display = "none";
      errorBox.style.display = "block";
    }

    document.getElementById("likeBtn")
      .addEventListener("click", async () => {

        if (!movieData || !movieData.id) return;

        try {
          const response = await fetch(
            `/api/movies/${movieData.id}/like`,
            { method: "POST" }
          );

          const data = await response.json();

          if (response.ok) {
            document.getElementById("likeCount").textContent =
              data.likes;
          }

        } catch (error) {
          console.error("Like error:", error);
        }
      });

    document.getElementById("dislikeBtn")
      .addEventListener("click", async () => {

        if (!movieData || !movieData.id) return;

        try {
          const response = await fetch(
            `/api/movies/${movieData.id}/dislike`,
            { method: "POST" }
          );

          const data = await response.json();

          if (response.ok) {
            document.getElementById("dislikeCount").textContent =
              data.dislikes;
          }

        } catch (error) {
          console.error("Dislike error:", error);
        }
      });


    document.getElementById("downloadBtn")
      .addEventListener("click", () => {

        const menu =
          document.getElementById("downloadMenu");

        menu.style.display =
          menu.style.display === "block"
            ? "none"
            : "block";
      });

    document.getElementById("qualitySelect")
      .addEventListener("change", function () {

        const quality = this.value;

        if (!movieData) return;

        console.log("Selected quality:", quality);

        // अभी backend में एक ही video file है,
        // इसलिए सभी options फिलहाल उसी video को use करेंगे.
      });

    function downloadMovie(quality) {

      if (!movieData || !movieData.videoUrl) {
        return;
      }

      const link = document.createElement("a");

      link.href = movieData.videoUrl;
      link.download =
        `${movieData.title || "movie"}-${quality}`;

      document.body.appendChild(link);
      link.click();
      link.remove();

      document.getElementById("downloadMenu")
        .style.display = "none";
    }

    loadMovie();

  </script>

</body>
</html>
