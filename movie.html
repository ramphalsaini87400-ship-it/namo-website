<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Download Movie - NAMO</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #111;
    }

    header {
      background: #0757b8;
      color: white;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
      color: #ff9800;
    }

    .home-btn {
      background: white;
      color: #0757b8;
      border: none;
      padding: 9px 15px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .container {
      max-width: 900px;
      margin: 20px auto;
      padding: 0 15px;
    }

    #loading {
      text-align: center;
      padding: 60px 10px;
      font-size: 20px;
    }

    #errorBox {
      display: none;
      text-align: center;
      padding: 60px 10px;
      font-size: 20px;
    }

    .details {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 3px 15px rgba(0,0,0,.08);
    }

    .poster {
      width: 100%;
      max-width: 320px;
      margin: 0 auto 20px;
      display: block;
      border-radius: 10px;
      object-fit: cover;
    }

    .details h1 {
      margin-bottom: 8px;
      font-size: 26px;
    }

    .meta {
      color: #666;
      margin-bottom: 15px;
    }

    .description {
      line-height: 1.6;
      color: #333;
      margin-bottom: 20px;
    }

    .action-bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .action-btn {
      border: none;
      padding: 11px 17px;
      border-radius: 7px;
      cursor: pointer;
      background: #0757b8;
      color: white;
      font-weight: bold;
    }

    .download-section {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #ddd;
    }

    .download-section h2 {
      font-size: 21px;
      margin-bottom: 14px;
    }

    .download-buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .download-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #168f45;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .download-btn:hover {
      opacity: .9;
    }

    .download-btn.disabled {
      background: #999;
      cursor: not-allowed;
    }

    @media (max-width: 600px) {
      header {
        padding: 12px 15px;
      }

      .logo {
        font-size: 24px;
      }

      .container {
        margin-top: 12px;
      }

      .details {
        padding: 15px;
      }
    }
  </style>
    <link rel="icon" type="image/png" href="/favicon.png">
</head>

<body>

<header>
  <div class="logo">NAMO</div>

  <button class="home-btn"
          onclick="location.href='index.html'">
    🏠 Home
  </button>
</header>

<main class="container">

  <div id="loading">
    🎬 Loading movie...
  </div>

  <div id="errorBox">
    ❌ Movie not found.
    <br><br>

    <button class="action-btn"
            onclick="location.href='index.html'">
      Back to Home
    </button>
  </div>

  <div id="moviePage" style="display:none;">

    <section class="details">

      <img
        id="moviePoster"
        class="poster"
        src=""
        alt="Movie Poster"
      >

      <h1 id="movieTitle">
        Movie
      </h1>

      <div class="meta" id="movieMeta">
        Movie
      </div>

      <p class="description"
         id="movieDescription">
        Description
      </p>

      <div class="action-bar">

        <button class="action-btn"
                id="likeBtn">
          👍 <span id="likeCount">0</span>
        </button>

        <button class="action-btn"
                id="dislikeBtn">
          👎 <span id="dislikeCount">0</span>
        </button>

      </div>


      <div class="download-section">

        <h2>⬇️ Download Movie</h2>

        <div class="download-buttons">

          <button
            class="download-btn"
            id="download1080">
            ⬇️ Download 1080p
          </button>

          <button
            class="download-btn"
            id="download720">
            ⬇️ Download 720p
          </button>

          <button
            class="download-btn"
            id="download480">
            ⬇️ Download 480p
          </button>

        </div>

      </div>

    </section>

  </div>

</main>


<script>

  const params =
    new URLSearchParams(location.search);

  const movieId =
    params.get("id");

  const loading =
    document.getElementById("loading");

  const moviePage =
    document.getElementById("moviePage");

  const errorBox =
    document.getElementById("errorBox");

  let movieData = null;


  // =========================
  // LOAD MOVIE
  // =========================

  async function loadMovie() {

    if (!movieId) {
      showError();
      return;
    }

    try {

      const response =
        await fetch(
          `/api/movies/${encodeURIComponent(movieId)}`
        );

      if (!response.ok) {
        throw new Error("Movie not found");
      }

      movieData =
        await response.json();


      document.getElementById(
        "movieTitle"
      ).textContent =
        movieData.title ||
        "Untitled Movie";


      document.getElementById(
        "movieMeta"
      ).textContent =
        `${movieData.category || "Movie"}${movieData.year ? " • " + movieData.year : ""}`;


      document.getElementById(
        "movieDescription"
      ).textContent =
        movieData.description ||
        "No description available.";


      // POSTER

      const poster =
        document.getElementById(
          "moviePoster"
        );

      if (movieData.posterUrl) {

        poster.src =
          movieData.posterUrl;

      } else {

        poster.style.display =
          "none";
      }


      // LIKES

      document.getElementById(
        "likeCount"
      ).textContent =
        movieData.likes || 0;


      document.getElementById(
        "dislikeCount"
      ).textContent =
        movieData.dislikes || 0;


      loading.style.display =
        "none";

      moviePage.style.display =
        "block";


      setupDownloadButton(
        "download1080",
        movieData.download1080
      );

      setupDownloadButton(
        "download720",
        movieData.download720
      );

      setupDownloadButton(
        "download480",
        movieData.download480
      );


    } catch (error) {

      console.error(error);

      showError();
    }
  }


  // =========================
  // DOWNLOAD BUTTON
  // =========================

  function setupDownloadButton(
    buttonId,
    url
  ) {

    const button =
      document.getElementById(
        buttonId
      );

    if (!url) {

      button.classList.add(
        "disabled"
      );

      button.textContent =
        "❌ Not Available";

      button.disabled =
        true;

      return;
    }


    button.addEventListener(
      "click",
      function() {

        window.open(
          url,
          "_blank",
          "noopener,noreferrer"
        );

      }
    );
  }


  // =========================
  // LIKE
  // =========================

  document.getElementById("likeBtn")
    .addEventListener(
      "click",
      async () => {

        if (!movieData ||
            !movieData.id) return;

        try {

          const response =
            await fetch(
              `/api/movies/${movieData.id}/like`,
              {
                method: "POST"
              }
            );

          const data =
            await response.json();

          if (response.ok) {

            document.getElementById(
              "likeCount"
            ).textContent =
              data.likes;
          }

        } catch (error) {

          console.error(
            "Like error:",
            error
          );
        }
      }
    );


  // =========================
  // DISLIKE
  // =========================

  document.getElementById("dislikeBtn")
    .addEventListener(
      "click",
      async () => {

        if (!movieData ||
            !movieData.id) return;

        try {

          const response =
            await fetch(
              `/api/movies/${movieData.id}/dislike`,
              {
                method: "POST"
              }
            );

          const data =
            await response.json();

          if (response.ok) {

            document.getElementById(
              "dislikeCount"
            ).textContent =
              data.dislikes;
          }

        } catch (error) {

          console.error(
            "Dislike error:",
            error
          );
        }
      }
    );


  // =========================
  // ERROR
  // =========================

  function showError() {

    loading.style.display =
      "none";

    moviePage.style.display =
      "none";

    errorBox.style.display =
      "block";
  }


  loadMovie();

</script>

</body>
</html>
