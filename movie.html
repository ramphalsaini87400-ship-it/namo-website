<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Watch Movie - NAMO</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0f0f0f;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      height: 60px;
      background: #0756d9;
      display: flex;
      align-items: center;
      padding: 0 18px;
      justify-content: space-between;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
      color: #ff9800;
    }

    .home-btn {
      background: white;
      color: #0756d9;
      border: none;
      padding: 9px 16px;
      border-radius: 7px;
      font-weight: bold;
      cursor: pointer;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 20px;
    }

    .player-box {
      background: #000;
      width: 100%;
      border-radius: 10px;
      overflow: hidden;
    }

    video {
      width: 100%;
      display: block;
      max-height: 650px;
      background: #000;
    }

    .action-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .action-btn {
      background: #242424;
      color: white;
      border: none;
      padding: 11px 16px;
      border-radius: 22px;
      cursor: pointer;
      font-size: 15px;
    }

    .action-btn:hover {
      background: #333;
    }

    .liked {
      background: #0756d9;
    }

    .download-box {
      position: relative;
    }

    .download-menu {
      display: none;
      position: absolute;
      top: 48px;
      right: 0;
      background: #242424;
      min-width: 170px;
      border-radius: 8px;
      overflow: hidden;
      z-index: 20;
    }

    .download-menu button {
      width: 100%;
      border: none;
      background: #242424;
      color: white;
      padding: 13px;
      text-align: left;
      cursor: pointer;
    }

    .download-menu button:hover {
      background: #333;
    }

    .quality-box {
      margin-left: auto;
    }

    select {
      background: #242424;
      color: white;
      border: none;
      padding: 11px 14px;
      border-radius: 20px;
      outline: none;
    }

    .details {
      margin-top: 20px;
      background: #181818;
      padding: 20px;
      border-radius: 10px;
    }

    .title {
      font-size: 26px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .meta {
      color: #aaa;
      margin-bottom: 15px;
    }

    .description {
      color: #ddd;
      line-height: 1.6;
    }

    .loading {
      text-align: center;
      padding: 50px 20px;
    }

    .error {
      text-align: center;
      padding: 50px 20px;
      color: #ff6b6b;
    }

    @media (max-width: 600px) {
      main {
        padding: 10px;
      }

      .title {
        font-size: 21px;
      }

      .quality-box {
        margin-left: 0;
      }

      .action-btn {
        padding: 10px 13px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">NAMO</div>
  <button class="home-btn" onclick="location.href='index.html'">
    Home
  </button>
</header>

<main>

  <div id="loading" class="loading">
    Loading movie...
  </div>

  <div id="moviePage" style="display:none;">

    <div class="player-box">
      <video id="videoPlayer" controls playsinline></video>
    </div>

    <div class="action-bar">

      <button id="likeBtn" class="action-btn">
        👍 Like <span id="likeCount">0</span>
      </button>

      <button id="dislikeBtn" class="action-btn">
        👎 Dislike <span id="dislikeCount">0</span>
      </button>

      <div class="download-box">

        <button id="downloadBtn" class="action-btn">
          ⬇ Download
        </button>

        <div id="downloadMenu" class="download-menu">

          <button onclick="downloadMovie('1080p')">
            HD 1080p
          </button>

          <button onclick="downloadMovie('720p')">
            HD 720p
          </button>

          <button onclick="downloadMovie('480p')">
            480p
          </button>

        </div>

      </div>

      <div class="quality-box">

        <select id="qualitySelect">
          <option value="auto">⚙ Auto</option>
          <option value="1080p">1080p</option>
          <option value="720p">720p</option>
          <option value="480p">480p</option>
        </select>

      </div>

    </div>

    <div class="details">

      <div id="movieTitle" class="title"></div>

      <div id="movieMeta" class="meta"></div>

      <div id="movieDescription" class="description"></div>

    </div>

  </div>

  <div id="error" class="error" style="display:none;">
    Movie load nahi ho payi.
  </div>

</main>

<script>

  const params = new URLSearchParams(location.search);
  const movieId = params.get("id");

  let movieData = null;

  const loading = document.getElementById("loading");
  const moviePage = document.getElementById("moviePage");
  const errorBox = document.getElementById("error");

  const video = document.getElementById("videoPlayer");

  async function loadMovie() {

    if (!movieId) {
      showError();
      return;
    }

    try {

      const response =
        await fetch(`/api/movies/${encodeURIComponent(movieId)}`);

      if (!response.ok) {
        throw new Error("Movie not found");
      }

      movieData = await response.json();

      document.getElementById("movieTitle").textContent =
        movieData.title || "Untitled Movie";

      document.getElementById("movieMeta").textContent =
        `${movieData.category || "Movie"} • ${movieData.year || ""}`;

      document.getElementById("movieDescription").textContent =
        movieData.description || "No description available.";

      video.src = movieData.videoUrl;

      document.getElementById("likeCount").textContent =
        movieData.likes || 0;

      document.getElementById("dislikeCount").textContent =
        movieData.dislikes || 0;

      loading.style.display = "none";
      moviePage.style.display = "block";

    } catch (error) {

      console.error(error);
      showError();

    }
  }

  function showError() {

    loading.style.display = "none";
    moviePage.style.display = "none";
    errorBox.style.display = "block";

  }

  // Download menu

  document.getElementById("downloadBtn")
    .addEventListener("click", function() {

      const menu = document.getElementById("downloadMenu");

      menu.style.display =
        menu.style.display === "block"
          ? "none"
          : "block";

    });

  // Quality selector

  document.getElementById("qualitySelect")
    .addEventListener("change", function() {

      const quality = this.value;

      if (!movieData) return;

      /*
        Abhi backend mein ek hi video file hai.
        Isliye Auto/current video hi play hoga.

        Baad mein hum:
        1080p
        720p
        480p
        ki separate files connect karenge.
      */

      console.log("Selected quality:", quality);

    });

  // Like

  // Like
document.getElementById("likeBtn")
  .addEventListener("click", async function() {

    if (!movieData || !movieData.id) return;

    const response = await fetch(
      `/api/movies/${movieData.id}/like`,
      { method: "POST" }
    );

    const data = await response.json();

    if (response.ok) {
      document.getElementById("likeCount").textContent =
        data.likes;
      this.classList.add("liked");
    }
  });


// Dislike
document.getElementById("dislikeBtn")
  .addEventListener("click", async function() {

    if (!movieData || !movieData.id) return;

    const response = await fetch(
      `/api/movies/${movieData.id}/dislike`,
      { method: "POST" }
    );

    const data = await response.json();

    if (response.ok) {
      document.getElementById("dislikeCount").textContent =
        data.dislikes;
      this.classList.add("liked");
    }
  });

    });

  // Dislike

  document.getElementById("dislikeBtn")
    .addEventListener("click", function() {

      this.classList.toggle("liked");

    });

  // Download

  function downloadMovie(quality) {

    if (!movieData || !movieData.videoUrl) {
      return;
    }

    /*
      Filhaal original uploaded video download hoga.
      Real 1080p/720p/480p downloads next step mein
      separate files ke saath connect honge.
    */

    const link = document.createElement("a");

    link.href = movieData.videoUrl;
    link.download =
      `${movieData.title || "movie"}-${quality}`;

    document.body.appendChild(link);

    link.click();

    link.remove();

    document.getElementById("downloadMenu")
      .style.display = "none";

  }

  loadMovie();

</script>

</body>
</html>
