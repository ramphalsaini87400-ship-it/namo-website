<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NAMO Admin Panel</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b0b0b;
    color: #fff;
}

.header {
    background: #151515;
    padding: 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #333;
}

.logo {
    font-size: 25px;
    font-weight: bold;
    color: #ff9800;
}

.header a {
    color: #fff;
    text-decoration: none;
    background: #252525;
    padding: 9px 14px;
    border-radius: 7px;
}

.container {
    width: 94%;
    max-width: 700px;
    margin: 25px auto;
}

.card {
    background: #151515;
    padding: 22px;
    border-radius: 12px;
    border: 1px solid #292929;
}

h1 {
    margin-top: 0;
}

label {
    display: block;
    margin-top: 18px;
    margin-bottom: 7px;
    font-weight: bold;
}

input,
textarea,
select {
    width: 100%;
    padding: 13px;
    background: #0d0d0d;
    color: white;
    border: 1px solid #444;
    border-radius: 7px;
    outline: none;
}

textarea {
    min-height: 110px;
    resize: vertical;
}

input:focus,
textarea:focus,
select:focus {
    border-color: #ff9800;
}

.preview {
    display: none;
    width: 160px;
    margin-top: 12px;
    border-radius: 8px;
}

button {
    width: 100%;
    margin-top: 25px;
    padding: 14px;
    border: 0;
    border-radius: 8px;
    background: #ff9800;
    color: #000;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.note {
    margin-top: 15px;
    padding: 12px;
    background: #202020;
    border-radius: 7px;
    color: #bbb;
    font-size: 14px;
    line-height: 1.5;
}

.progress {
    display: none;
    margin-top: 18px;
}

.progressBar {
    width: 100%;
    height: 10px;
    background: #333;
    border-radius: 10px;
    overflow: hidden;
}

#progressFill {
    width: 0%;
    height: 100%;
    background: #ff9800;
}

#progressText {
    margin-top: 7px;
    color: #bbb;
    font-size: 14px;
}

#message {
    margin-top: 18px;
    font-weight: bold;
    line-height: 1.5;
}

.small {
    color: #888;
    font-size: 13px;
}
</style>
    <link rel="icon" type="image/png" href="/favicon.png">
</head>

<body>

<div class="header">
    <div class="logo">NAMO</div>
</div>

<div class="container">

<div class="card">

<h1>🎬 Upload Movie</h1>

<div class="note">
    केवल अपनी, licensed, authorized या public-domain movie/files के
    legal download links इस्तेमाल करें।
</div>

<label>Admin Password</label>
<input
    type="password"
    id="password"
    placeholder="Admin password"
    autocomplete="current-password"
>

<label>Movie Name</label>
<input
    type="text"
    id="title"
    placeholder="Movie name"
>

<label>Category</label>
<select id="category">
    <option value="Movie">Movie</option>
    <option value="Action">Action</option>
    <option value="Comedy">Comedy</option>
    <option value="Drama">Drama</option>
    <option value="Romance">Romance</option>
    <option value="Thriller">Thriller</option>
    <option value="Animation">Animation</option>
    <option value="Documentary">Documentary</option>
</select>

<label>Release Year</label>
<input
    type="number"
    id="year"
    placeholder="2026"
>

<label>Description</label>
<textarea
    id="description"
    placeholder="Movie description"
></textarea>

<label>Poster</label>
<input
    type="file"
    id="poster"
    accept="image/*"
>

<img id="posterPreview" class="preview">

<label>1080p Download Link</label>
<input
    type="url"
    id="download1080"
    placeholder="https://example.com/movie-1080p.mp4"
>

<label>720p Download Link</label>
<input
    type="url"
    id="download720"
    placeholder="https://example.com/movie-720p.mp4"
>

<label>480p Download Link</label>
<input
    type="url"
    id="download480"
    placeholder="https://example.com/movie-480p.mp4"
>

<div class="small">
    कम से कम एक legal download link देना जरूरी है।
</div>

<div class="progress" id="progressArea">

    <div class="progressBar">
        <div id="progressFill"></div>
    </div>

    <div id="progressText">
        Uploading 0%
    </div>

</div>

<button id="uploadButton" onclick="uploadMovie()">
    🚀 Publish Movie
</button>

<div id="message"></div>

</div>
</div>

<script>

const posterInput = document.getElementById("poster");

posterInput.addEventListener("change", function () {

    const file = this.files[0];

    const preview =
        document.getElementById("posterPreview");

    if (!file) {
        preview.style.display = "none";
        preview.removeAttribute("src");
        return;
    }

    preview.src = URL.createObjectURL(file);
    preview.style.display = "block";
});


function uploadMovie() {

    const password =
        document.getElementById("password").value.trim();

    const title =
        document.getElementById("title").value.trim();

    const category =
        document.getElementById("category").value;

    const year =
        document.getElementById("year").value.trim();

    const description =
        document.getElementById("description").value.trim();

    const poster =
        posterInput.files[0];

    const download1080 =
        document.getElementById("download1080").value.trim();

    const download720 =
        document.getElementById("download720").value.trim();

    const download480 =
        document.getElementById("download480").value.trim();

    const button =
        document.getElementById("uploadButton");

    const message =
        document.getElementById("message");

    const progressArea =
        document.getElementById("progressArea");

    const progressFill =
        document.getElementById("progressFill");

    const progressText =
        document.getElementById("progressText");


    message.textContent = "";


    if (!password) {
        message.textContent =
            "❌ Admin password enter karo.";
        message.style.color = "red";
        return;
    }


    if (!title) {
        message.textContent =
            "❌ Movie name enter karo.";
        message.style.color = "red";
        return;
    }


    if (!poster) {
        message.textContent =
            "❌ Poster select karo.";
        message.style.color = "red";
        return;
    }


    if (
        !download1080 &&
        !download720 &&
        !download480
    ) {
        message.textContent =
            "❌ कम से कम एक download link enter karo.";
        message.style.color = "red";
        return;
    }


    const formData =
        new FormData();

    formData.append(
        "title",
        title
    );

    formData.append(
        "category",
        category
    );

    formData.append(
        "year",
        year
    );

    formData.append(
        "description",
        description
    );

    formData.append(
        "poster",
        poster
    );

    formData.append(
        "download1080",
        download1080
    );

    formData.append(
        "download720",
        download720
    );

    formData.append(
        "download480",
        download480
    );


    const xhr =
        new XMLHttpRequest();


    button.disabled = true;

    button.textContent =
        "Uploading...";

    progressArea.style.display =
        "block";

    progressFill.style.width =
        "0%";

    progressText.textContent =
        "Uploading 0%";


    xhr.open(
        "POST",
        "/api/movies",
        true
    );


    xhr.setRequestHeader(
        "x-admin-password",
        password
    );


    xhr.upload.addEventListener(
        "progress",
        function (event) {

            if (event.lengthComputable) {

                const percent =
                    Math.round(
                        (event.loaded /
                        event.total) * 100
                    );

                progressFill.style.width =
                    percent + "%";

                progressText.textContent =
                    "Uploading " + percent + "%";
            }
        }
    );


    xhr.onload = function () {

        button.disabled = false;

        button.textContent =
            "🚀 Publish Movie";


        let data = null;

        try {
            data =
                JSON.parse(xhr.responseText);
        } catch (e) {
            data = null;
        }


        if (
            xhr.status >= 200 &&
            xhr.status < 300
        ) {

            progressFill.style.width =
                "100%";

            progressText.textContent =
                "100% — Upload Complete";

            message.textContent =
                "✅ Movie successfully published!";

            message.style.color =
                "#00d26a";


            setTimeout(function () {

                window.location.href = "/admin.html";

            }, 1200);

        } else {

            let error =
                "Upload failed.";

            if (
                data &&
                data.error
            ) {
                error =
                    data.error;
            }

            message.textContent =
                "❌ " + error;

            message.style.color =
                "red";
        }

    };


    xhr.onerror = function () {

        button.disabled = false;

        button.textContent =
            "🚀 Publish Movie";

        message.textContent =
            "❌ Network/server error.";

        message.style.color =
            "red";
    };


    xhr.ontimeout = function () {

        button.disabled = false;

        button.textContent =
            "🚀 Publish Movie";

        message.textContent =
            "❌ Request timeout.";

        message.style.color =
            "red";
    };


    xhr.send(formData);
}

</script>


<section id="moviesSection" style="max-width:900px;margin:30px auto;padding:20px;background:#151515;border-radius:16px;">
    <h2 style="margin-top:0;">🎬 Published Movies</h2>
    <div id="moviesList">
        Movies loading...
    </div>
</section>

<script>
async function loadMoviesForAdmin() {
    const list = document.getElementById("moviesList");

    try {
        const response = await fetch("/api/movies");
        const movies = await response.json();

        if (!movies.length) {
            list.innerHTML = "<p>No movies published yet.</p>";
            return;
        }

        list.innerHTML = movies.map(movie => `
            <div style="display:flex;align-items:center;gap:15px;padding:12px 0;border-bottom:1px solid #333;">
                <img src="${movie.posterUrl || ""}"
                     style="width:70px;height:90px;object-fit:cover;border-radius:8px;">
                <div style="flex:1;">
                    <strong>${escapeAdminText(movie.title)}</strong>
                    <div style="font-size:13px;color:#aaa;">
                        ${escapeAdminText(movie.category || "")} • ${escapeAdminText(movie.year || "")}
                    </div>
                </div>
                <button
                    onclick="deleteMovie('${movie.id}')"
                    style="background:#d32f2f;color:white;border:0;padding:10px 14px;border-radius:8px;cursor:pointer;">
                    🗑️ Delete
                </button>
            </div>
        `).join("");

    } catch (error) {
        list.innerHTML = "<p style='color:red;'>Movies load nahi ho paayi.</p>";
    }
}

function escapeAdminText(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

async function deleteMovie(id) {
    const password = document.getElementById("password").value.trim();

    if (!password) {
        alert("Pehle Admin Password enter karo.");
        return;
    }

    if (!confirm("Kya tum is movie ko delete karna chahte ho?")) {
        return;
    }

    try {
        const response = await fetch("/api/movies/" + encodeURIComponent(id), {
            method: "DELETE",
            headers: {
                "x-admin-password": password
            }
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "Delete failed");
        }

        alert("Movie successfully deleted.");
        loadMoviesForAdmin();

    } catch (error) {
        alert("❌ " + error.message);
    }
}

loadMoviesForAdmin();
</script>

</body>
</html>
