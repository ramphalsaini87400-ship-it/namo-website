<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>NAMO Admin Dashboard</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f4f7;
    color: #222;
}

header {
    background: #0878d1;
    color: white;
    padding: 16px 20px;
}

.header {
    max-width: 1100px;
    margin: auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    color: #ff9800;
    font-size: 30px;
    font-weight: bold;
}

.home {
    color: white;
    text-decoration: none;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

.login,
.dashboard,
.edit-box {
    background: white;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

input,
textarea,
select {
    width: 100%;
    padding: 12px;
    margin: 7px 0 14px;
    border: 1px solid #ddd;
    border-radius: 7px;
    font-size: 15px;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

button,
.upload-btn {
    border: 0;
    padding: 11px 16px;
    border-radius: 7px;
    cursor: pointer;
    font-weight: bold;
    text-decoration: none;
    display: inline-block;
}

.login-btn,
.upload-btn {
    background: #0878d1;
    color: white;
}

.logout {
    background: #555;
    color: white;
}

.edit {
    background: #0878d1;
    color: white;
}

.delete {
    background: #e53935;
    color: white;
}

.stats {
    display: grid;
    grid-template-columns:
        repeat(3, 1fr);

    gap: 15px;
    margin-bottom: 20px;
}

.stat {
    background: white;
    padding: 20px;
    border-radius: 12px;
    text-align: center;
    box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

.stat-number {
    font-size: 30px;
    font-weight: bold;
    color: #0878d1;
}

.movie {
    background: white;
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 15px;
    display: flex;
    gap: 15px;
    box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

.movie img {
    width: 110px;
    height: 150px;
    object-fit: cover;
    border-radius: 8px;
    background: #ddd;
}

.movie-info {
    flex: 1;
}

.movie-title {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 7px;
}

.meta {
    color: #777;
    margin-bottom: 10px;
}

.description {
    color: #555;
    margin-bottom: 12px;
}

.actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.hidden {
    display: none;
}

#message {
    margin-top: 10px;
    font-weight: bold;
}

.edit-box {
    max-width: 600px;
}

@media(max-width:650px) {

    .stats {
        grid-template-columns: 1fr;
    }

    .movie {
        flex-direction: column;
    }

    .movie img {
        width: 100%;
        height: 220px;
    }

}

</style>

</head>

<body>

<header>

<div class="header">

<div class="logo">
NAMO
</div>

<a href="index.html"
class="home">
🏠 Home
</a>

</div>

</header>


<div class="container">


<!-- LOGIN -->

<div id="loginBox"
class="login">

<h2>🔐 Admin Login</h2>

<input
type="password"
id="password"
placeholder="Admin Password">

<button
class="login-btn"
onclick="login()">

Login

</button>

<div id="loginMessage"></div>

</div>


<!-- DASHBOARD -->

<div id="dashboard"
class="hidden">


<div class="stats">

<div class="stat">

<div class="stat-number"
id="totalMovies">
0
</div>

<div>
Total Movies
</div>

</div>


<div class="stat">

<div class="stat-number"
id="totalCategories">
0
</div>

<div>
Categories
</div>

</div>


<div class="stat">

<div class="stat-number"
id="latestYear">
-
</div>

<div>
Latest Year
</div>

</div>

</div>


<div class="dashboard">

<div style="
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
flex-wrap:wrap;
">

<h2>
🎬 Movie Management
</h2>

<div>

<a
href="admin.html"
class="upload-btn">

➕ Upload Movie

</a>

<button
class="logout"
onclick="logout()">

Logout

</button>

</div>

</div>

<div id="movieList">
Loading...
</div>

</div>

</div>


<!-- EDIT -->

<div id="editBox"
class="edit-box hidden">

<h2>✏️ Edit Movie</h2>

<input
type="hidden"
id="editId">

<label>Movie Name</label>

<input
id="editTitle">


<label>Category</label>

<input
id="editCategory">


<label>Year</label>

<input
id="editYear">


<label>Description</label>

<textarea
id="editDescription"></textarea>

<label>1080p Download Link</label>

<input
id="editDownload1080"
type="url"
placeholder="https://example.com/movie-1080p.mp4">


<label>720p Download Link</label>

<input
id="editDownload720"
type="url"
placeholder="https://example.com/movie-720p.mp4">


<label>480p Download Link</label>

<input
id="editDownload480"
type="url"
placeholder="https://example.com/movie-480p.mp4">

<button
class="edit"
onclick="saveEdit()">

💾 Save Changes

</button>

<button
class="logout"
onclick="closeEdit()">

Cancel

</button>

<div id="editMessage"></div>

</div>


</div>


<script>

let adminPassword = "";


// ======================
// LOGIN
// ======================

async function login() {

    const password =
        document.getElementById(
            "password"
        ).value.trim();

    if (!password) {

        document.getElementById(
            "loginMessage"
        ).textContent =
            "Password enter karo.";

        return;
    }

    try {

        const response =
            await fetch(
                "/api/admin/check",
                {
                    headers: {
                        "x-admin-password":
                            password
                    }
                }
            );

        if (!response.ok) {

            throw new Error(
                "Wrong password"
            );
        }

        adminPassword = password;

        document.getElementById(
            "loginBox"
        ).classList.add("hidden");

        document.getElementById(
            "dashboard"
        ).classList.remove("hidden");

        loadMovies();

    } catch (error) {

        document.getElementById(
            "loginMessage"
        ).textContent =
            "❌ Wrong password.";

    }
}


// ======================
// LOGOUT
// ======================

function logout() {

    adminPassword = "";

    document.getElementById(
        "dashboard"
    ).classList.add("hidden");

    document.getElementById(
        "editBox"
    ).classList.add("hidden");

    document.getElementById(
        "loginBox"
    ).classList.remove("hidden");

    document.getElementById(
        "password"
    ).value = "";
}


// ======================
// LOAD MOVIES
// ======================

async function loadMovies() {

    try {

        const response =
            await fetch(
                "/api/movies"
            );

        const movies =
            await response.json();

        document.getElementById(
            "totalMovies"
        ).textContent =
            movies.length;

        const categories =
            new Set(
                movies.map(
                    movie =>
                        movie.category
                )
            );

        document.getElementById(
            "totalCategories"
        ).textContent =
            categories.size;

        const years =
            movies
                .map(m => Number(m.year))
                .filter(y => !isNaN(y));

        document.getElementById(
            "latestYear"
        ).textContent =
            years.length
                ? Math.max(...years)
                : "-";


        const list =
            document.getElementById(
                "movieList"
            );

        list.innerHTML = "";


        if (!movies.length) {

            list.innerHTML =
                "<p>No movies uploaded yet.</p>";

            return;
        }


        movies.forEach(movie => {

            const div =
                document.createElement(
                    "div"
                );

            div.className = "movie";


            const poster =
                document.createElement(
                    "img"
                );

            poster.src =
                movie.posterUrl;

            poster.alt =
                movie.title || "Movie";


            const info =
                document.createElement(
                    "div"
                );

            info.className =
                "movie-info";


            const title =
                document.createElement(
                    "div"
                );

            title.className =
                "movie-title";

            title.textContent =
                movie.title;


            const meta =
                document.createElement(
                    "div"
                );

            meta.className =
                "meta";

            meta.textContent =
                `${movie.category || "Movie"} • ${movie.year || ""}`;


            const description =
                document.createElement(
                    "div"
                );

            description.className =
                "description";

            description.textContent =
                movie.description ||
                "No description";

document.getElementById(
    "editDownload1080"
).value =
    movie.download1080 || "";

document.getElementById(
    "editDownload720"
).value =
    movie.download720 || "";

document.getElementById(
    "editDownload480"
).value =
    movie.download480 || "";

            const actions =
                document.createElement(
                    "div"
                );

            actions.className =
                "actions";


            const editButton =
                document.createElement(
                    "button"
                );

            editButton.className =
                "edit";

            editButton.textContent =
                "✏️ Edit";

            editButton.onclick =
                () => openEdit(movie);


            const deleteButton =
                document.createElement(
                    "button"
                );

            deleteButton.className =
                "delete";

            deleteButton.textContent =
                "🗑️ Delete";

            deleteButton.onclick =
                () => deleteMovie(movie.id);


            actions.appendChild(
                editButton
            );

            actions.appendChild(
                deleteButton
            );


            info.appendChild(title);
            info.appendChild(meta);
            info.appendChild(description);
            info.appendChild(actions);


            div.appendChild(poster);
            div.appendChild(info);

            list.appendChild(div);

        });

    } catch (error) {

        document.getElementById(
            "movieList"
        ).textContent =
            "Movies load nahi ho paayi.";

    }
}


// ======================
// OPEN EDIT
// ======================

function openEdit(movie) {

    document.getElementById(
        "editId"
    ).value = movie.id;

    document.getElementById(
        "editTitle"
    ).value = movie.title || "";

    document.getElementById(
        "editCategory"
    ).value = movie.category || "";

    document.getElementById(
        "editYear"
    ).value = movie.year || "";

    document.getElementById(
        "editDescription"
    ).value =
        movie.description || "";

    document.getElementById(
        "editBox"
    ).classList.remove("hidden");

    window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
    });
}


// ======================
// CLOSE EDIT
// ======================

function closeEdit() {

    document.getElementById(
        "editBox"
    ).classList.add("hidden");

}


// ======================
// SAVE EDIT
// ======================

async function saveEdit() {

    const id =
        document.getElementById(
            "editId"
        ).value;

    const data = {

        title:
            document.getElementById(
                "editTitle"
            ).value,

        category:
            document.getElementById(
                "editCategory"
            ).value,

        year:
            document.getElementById(
                "editYear"
            ).value,

        description:
            document.getElementById(
                "editDescription"
            ).value

    };

download1080:
    document.getElementById(
        "editDownload1080"
    ).value.trim(),

download720:
    document.getElementById(
        "editDownload720"
    ).value.trim(),

download480:
    document.getElementById(
        "editDownload480"
    ).value.trim(),

description:
    document.getElementById(
        "editDescription"
    ).value,

download1080:
    document.getElementById(
        "editDownload1080"
    ).value.trim(),

download720:
    document.getElementById(
        "editDownload720"
    ).value.trim(),

download480:
    document.getElementById(
        "editDownload480"
    ).value.trim()

    try {

        const response =
            await fetch(
                "/api/movies/" +
                encodeURIComponent(id),
                {
                    method: "PATCH",

                    headers: {
                        "Content-Type":
                            "application/json",

                        "x-admin-password":
                            adminPassword
                    },

                    body:
                        JSON.stringify(data)
                }
            );


        if (!response.ok) {

            throw new Error(
                "Edit failed"
            );
        }


        document.getElementById(
            "editMessage"
        ).textContent =
            "✅ Movie updated.";


        await loadMovies();


        setTimeout(() => {

            closeEdit();

            document.getElementById(
                "editMessage"
            ).textContent = "";

        }, 800);


    } catch (error) {

        document.getElementById(
            "editMessage"
        ).textContent =
            "❌ Update failed.";

    }
}


// ======================
// DELETE MOVIE
// ======================

async function deleteMovie(id) {

    const ok =
        confirm(
            "Kya aap is movie ko delete karna chahte ho?"
        );

    if (!ok) return;


    try {

        const response =
            await fetch(
                "/api/movies/" +
                encodeURIComponent(id),
                {
                    method: "DELETE",

                    headers: {
                        "x-admin-password":
                            adminPassword
                    }
                }
            );


        if (!response.ok) {

            throw new Error(
                "Delete failed"
            );
        }


        alert(
            "Movie delete ho gayi."
        );

        loadMovies();


    } catch (error) {

        alert(
            "❌ Movie delete nahi hui."
        );

    }
}

</script>

</body>

</html>
